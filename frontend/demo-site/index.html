<!DOCTYPE html>
<html>
<head>
  <title>X Education - Online Courses</title>
</head>
<body>
  <h1>Welcome to X Education</h1>
  <p>Explore our professional courses below.</p>
  <a href="pricing.html">View Pricing</a>

  <script>
    const visitorId = "visitor_" + Math.floor(Math.random() * 10000);
    const startTime = Date.now();
    window.addEventListener("beforeunload", () => {
  const timeSpent = Math.round((Date.now() - startTime) / 1000);
  const payload = JSON.stringify({
    visitor_id: visitorId,
    "Lead Origin": "Landing Page Submission",
    "Lead Source": "Direct Traffic",
    "Total Time Spent on Website": timeSpent,
    "TotalVisits": 1,
    "Page Views Per Visit": 1
  });
  const blob = new Blob([payload], { type: "text/plain" });
  navigator.sendBeacon("http://127.0.0.1:5000/track", blob);
});
  </script>
</body>
</html>
